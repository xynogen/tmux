name: packages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override package version (default: derived from configure.ac / tag)"
        required: false
        type: string

jobs:
  build:
    name: build-ubuntu2404
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install build & packaging tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config bison \
            libevent-dev libncurses-dev libutempter-dev \
            ruby ruby-dev rubygems rpm
          sudo gem install --no-document fpm

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$VERSION_INPUT" ]; then
            v="$VERSION_INPUT"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(awk '/^AC_INIT/ { gsub(/[][)(,]/, " "); print $3; exit }' configure.ac | sed 's/^next-//')"
            v="${v}+git$(git rev-parse --short HEAD)"
          fi
          # fpm rejects '-' in deb versions; normalize
          v_deb="$(echo "$v" | tr -- '-' '~')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_deb=$v_deb" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v (deb: $v_deb)"

      - name: Configure & build
        run: |
          set -eu
          sh autogen.sh
          ./configure --prefix=/usr --sysconfdir=/etc --mandir=/usr/share/man
          make -j"$(nproc)"

      - name: Stage install
        run: |
          set -eu
          rm -rf "$PWD/stage"
          make install DESTDIR="$PWD/stage"
          find stage -type f | head -n 50

      - name: Package (deb)
        env:
          VERSION_DEB: ${{ steps.ver.outputs.version_deb }}
        run: |
          set -eu
          fpm -s dir -t deb \
            -n tmux \
            -v "$VERSION_DEB" \
            --iteration "1ubuntu24.04" \
            --architecture native \
            --maintainer "tmux packaging <packaging@localhost>" \
            --description "Terminal multiplexer" \
            --url "https://tmux.github.io/" \
            --license "ISC" \
            --depends "libc6" \
            --depends "libevent-2.1-7t64" \
            --depends "libtinfo6" \
            --deb-no-default-config-files \
            -C stage \
            usr

      - name: Package (rpm)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          fpm -s dir -t rpm \
            -n tmux \
            -v "$VERSION" \
            --iteration "1" \
            --architecture native \
            --maintainer "tmux packaging <packaging@localhost>" \
            --description "Terminal multiplexer" \
            --url "https://tmux.github.io/" \
            --license "ISC" \
            --depends "libevent" \
            --depends "ncurses-libs" \
            -C stage \
            usr

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ./*.deb ./*.rpm dist/
          ls -la dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tmux-ubuntu2404
          path: dist/*

  release:
    name: attach-to-release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Flatten
        run: |
          set -eu
          mkdir -p out
          find dist -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp -v {} out/ \;
          ls -la out

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber
